<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>ورود مدیریت | نئون لاین</title><link rel="stylesheet" href="styles.css"></head><body><main class="login-wrap"><form class="login-card" id="loginForm"><a class="brand" href="index.html"><img src="assets/neon-line-logo.png" alt=""><span>نئون لاین</span></a><h1>ورود به پنل مدیریت</h1><p>برای ورود از حسابی استفاده کنید که در Supabase ایجاد و به‌عنوان مدیر مجاز شده است.</p><div class="field"><label for="email">ایمیل</label><input id="email" name="email" type="email" autocomplete="username" required placeholder="admin@example.com"></div><div class="field"><label for="password">رمز عبور</label><input id="password" name="password" type="password" autocomplete="current-password" required placeholder="رمز عبور"></div><button class="button" type="submit">ورود امن</button><p id="loginStatus" class="login-status" aria-live="polite"></p><a class="text-link" href="index.html">← بازگشت به سایت</a></form></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script>
const form=document.getElementById('loginForm'),status=document.getElementById('loginStatus');form.addEventListener('submit',async e=>{e.preventDefault();status.textContent='در حال بررسی…';const c=window.NEON_CONFIG||{};if(!c.SUPABASE_URL||c.SUPABASE_URL.includes('YOUR-PROJECT')||!c.SUPABASE_ANON_KEY||c.SUPABASE_ANON_KEY.includes('YOUR_SUPABASE')){status.textContent='ابتدا اطلاعات پروژه Supabase را در config.js تنظیم کنید.';return;}try{const sb=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);const {error}=await sb.auth.signInWithPassword({email:form.email.value.trim(),password:form.password.value});if(error)throw error;location.href='admin.html';}catch(err){status.textContent='ورود انجام نشد: '+(err.message||'خطای ناشناخته');}});
</script></body></html>
